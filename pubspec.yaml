name: flutter_ar
description: 面向 Flutter 的实时人脸 AR 叠加库，提供相机预览、MediaPipe 人脸追踪与 Flutter Scene 内容挂载。
version: 0.2.0
repository: https://github.com/yuanzhihong/flutter_ar
documentation: https://github.com/yuanzhihong/flutter_ar/blob/main/doc/README.md
issue_tracker: https://github.com/yuanzhihong/flutter_ar/issues
topics:
  - ar
  - camera
  - face-tracking
  - mediapipe
  - flutter-scene

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0'

dependencies:
  camera: ^0.12.2
  camera_macos: ^0.1.1
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  mediapipe_face_mesh: ^3.2.2
  permission_handler: ^12.0.3
  plugin_platform_interface: ^2.0.2
  vector_math: ^2.4.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.yuanzhihong.flutter_ar
        pluginClass: FlutterArPlugin
      ios:
        pluginClass: FlutterArPlugin
      macos:
        pluginClass: FlutterArPlugin
