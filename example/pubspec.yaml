name: flutter_ar_plus_example
description: 演示 flutter_ar_plus 实时人脸 AR 叠加能力的示例应用。
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.2
  flutter_scene: ^0.24.3
  image: ^4.12.0
  mediapipe_face_mesh: ^3.2.2
  vector_math: ^2.4.4

  flutter_ar_plus:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/face_test.jpg
