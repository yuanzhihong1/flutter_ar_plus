name: 缺陷报告
description: 报告可复现的 flutter_ar 缺陷
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传未脱敏的人脸图像、录屏或隐私日志。
        使用前请先阅读故障排查文档。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小可复现步骤或示例仓库。
      placeholder: |
        1. 运行示例 ...
        2. 使用前置相机 ...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter 版本
      placeholder: 输出 `flutter --version` 的结果
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台与设备
      placeholder: Android 15 / Pixel 9、iOS 18 / iPhone 16、macOS 15 / MacBook Pro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与堆栈
      description: 请粘贴脱敏后的完整日志。
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除日志和附件中的个人信息、人脸图像与敏感数据。
          required: true
