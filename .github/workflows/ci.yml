name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: 格式、分析与测试
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: |
          flutter pub get
          cd example
          flutter pub get

      - name: 检查格式
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: ./tool/test.sh
